id = "numbered.tabs"
name = "Numbered Tabs"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Prefix every tab label with its current displayed position/shortcut number"
platforms = ["linux", "macos"]

[[startup]]
command = ["python3", "numbered_tabs.py", "reconcile"]

[[events]]
on = "tab.created"
command = ["python3", "numbered_tabs.py", "reconcile"]

[[events]]
on = "tab.closed"
command = ["python3", "numbered_tabs.py", "reconcile"]

[[events]]
on = "tab.moved"
command = ["python3", "numbered_tabs.py", "reconcile"]

[[events]]
on = "tab.renamed"
command = ["python3", "numbered_tabs.py", "reconcile"]

# Herdr 0.9.0 event behavior (re-checked 2026-09; supersedes the 0.8.2 notes):
#   * `tab.close` (CLI `herdr tab close`; TUI prefix+shift+x; context menu)
#     emits `tab.closed` to plugins -> hooked below. Was broken in 0.8.2, works
#     in 0.9.0.
#   * Closing a tab by closing its LAST pane (TUI prefix+x on a single-pane tab;
#     CLI `herdr pane close`) removes the tab but emits ONLY `pane.closed` --
#     no `tab.closed`, and no focus event. Without a `pane.closed` hook the
#     surviving tabs keep stale numbers. Hooked below.
#   * A pane whose PROCESS EXITS (agent/shell process ends; TUI close that
#     terminates the pane) autocloses the now-empty TAB and emits ONLY
#     `pane.exited` -- no `tab.closed`, no `pane.closed`. This is the most
#     common daily path for "deleting" a tab. Without a `pane.exited` hook the
#     surviving tabs keep stale numbers (the middle-close reindex bug the user
#     still hit after the pane.closed fix). Hooked below.
#   * `tab.focused` / `pane.focused` remain valid backstops (idempotent
#     reconcile makes extra events harmless) for any focus-move path.
[[events]]
on = "pane.exited"
command = ["python3", "numbered_tabs.py", "reconcile"]

[[events]]
on = "pane.closed"
command = ["python3", "numbered_tabs.py", "reconcile"]

[[events]]
on = "tab.focused"
command = ["python3", "numbered_tabs.py", "reconcile"]

[[events]]
on = "pane.focused"
command = ["python3", "numbered_tabs.py", "reconcile"]

[[actions]]
id = "reconcile"
title = "Renumber tabs"
contexts = ["workspace"]
command = ["python3", "numbered_tabs.py", "reconcile", "--force"]

[[actions]]
id = "rollback"
title = "Restore original tab labels"
contexts = ["workspace"]
command = ["python3", "numbered_tabs.py", "rollback"]
